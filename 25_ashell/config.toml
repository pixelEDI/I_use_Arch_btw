# ashell soll unten am Bildschirm angezeigt werden.
position = "Bottom"

[appearance]
success_color = "#a3be8c"
warning_color = "#ebcb8b"
danger_color = "#bf616a"
text_color = "#eceff4"
workspace_colors = ["#88c0d0", "#81a1c1", "#5e81ac"]
opacity = 0.6

[appearance.primary_color]
base = "#88c0d0"
text = "#242933"

[appearance.background_color]
base = "#3b4252"
weak = "#434c5e"
strong = "#4c566a"

[modules]
left = ["Workspaces"]
center = ["WindowTitle"]
right = ["SystemInfo", "Settings", "Tempo"]

[tempo]
# Kalender bleibt per Klick auf die Uhr erreichbar; KW steht im Uhrentext.
clock_format = "%a %d.%m. %R · KW %V"

[system_info]
indicators = ["Cpu", "Memory"]
interval = 5

[system_info.cpu]
format = "Percentage"

[system_info.temperature]
units = "Celsius"
sensor = "Cpu"

[workspaces]
visibility_mode = "MonitorSpecificExclusive"
enable_workspace_filling = false

[settings]
indicators = ["Audio"]
audio_indicator_format = "IconAndPercentage"

[[CustomModule]]
name = "gpu"
type = "Text"
# Radeon-GPU-Auslastung; funktioniert, wenn radeontop auf die GPU zugreifen kann.
listen_cmd = '''
while true; do
  value=$(radeontop -d - -l 1 2>/dev/null | awk -F'gpu ' 'NR==1 {split($2,a,"%"); print a[1]}')
  if [ -n "$value" ]; then
    printf '{"text":"GPU %s%%","alt":"gpu"}\n' "$value"
  fi
  sleep 5
done
'''

